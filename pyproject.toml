[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mamba3"
version = "0.1.0"
description = "JAX/Flax NNX implementation of Mamba3 model"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
dependencies = [
    "flax",
    "jax[cuda13]",
    "optax"
]
authors = [
    {name = "Williams Edi"}
]

[tool.setuptools]
package-dir = {"mamba3" = "mamba3"}